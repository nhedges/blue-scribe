<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="default.css">
        <script>
            function gen_connect_form(ssid) {
                var html = "<form action=\"/wifi/connect\" method=\"post\" enctype=\"multipart/form-data\" onsubmit=\"setTimeout(function(){load_network_list();}, 200);\">";
                html = html + "<input type=\"hidden\" id=\"ssid\" name=\"ssid\" value=\"" + ssid + "\">";
                html = html + "<input type=\"password\" id=\"psk\" name=\"psk\" value=\"\">";
                html = html + "<input type=\"submit\" id=\"connect-button\" value=\"Connect\">";
                html = html + "</form>";
                return html;
            }
            function forget_button_press(ssid) {
                var submit = confirm('Forget Network?');
                if (submit)
                {
                    var apiUrl = 'wifi/networks?ssid=' + ssid;
                    setTimeout(function() {fetch(apiUrl, {method: 'DELETE'});}, 10);
                    setTimeout(function() {load_network_list();}, 20);
                }
                return false;
            }
            function gen_forget_form(ssid) {
                var html = "<form id=\"delete-" + ssid + "\" method=\"post\" onsubmit=\"return forget_button_press('" + ssid + "');\"><input type=\"submit\" value=\"Forget\"></form>";
                return html;
            }
            function gen_net_entry(ssid, connected, remembered, security) {
                var html = "<tr><td>" + ssid + "</td>";
                if (connected) {
                    html = html + "<td style=\"color:Green\">Connected</td>"
                }
                else {
                    html = html + "<td>" + gen_connect_form(ssid) + "</td>";
                }
                if (remembered) {
                    html = html + "<td>" + gen_forget_form(ssid) + "</td>";
                }
                else {
                    html = html + "<td></td>";
                }
                html = html + "<td>" + security + "</td><tr>";
                return html;
            }
            function load_network_list() {
                var apiUrl = 'wifi/networks';
                fetch(apiUrl, {headers: {'Accept': 'application/json'}, cache: "no-store"}).then(response => {
                    return response.json();
                }).then(data => {
                    var newContent = "<tr><th>SSID</th><th>Connected</th><th>Known</th><th>Security</th></tr>";
                    for (var i = 0; i < data.length; i++) {
                        var a = data[i];
                        newContent = newContent + gen_net_entry(a.ssid, a.connected, a.remembered, a.security);
                    }
                    document.getElementById("networks").innerHTML = newContent;
                });
            }
            function on_load() {
                load_network_list();
            }
        </script>
    </head>
    <body onload="on_load()">
        <h1>WiFi Configuration</h1>
        <h2><a href="../">Home</a></h2>
        <h2>Networks</h2>
        <table id="networks"></table>
    </body>
</html>
